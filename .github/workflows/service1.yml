name: Service1 CI

on:
  push:
    branches:
      - main
    paths:
      - 'service1/**'
      - '.github/workflows/service1.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./service1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t veedhi1995/service1:${{ github.sha }} .
          docker tag veedhi1995/service1:${{ github.sha }} veedhi1995/service1:latest

      - name: Push Docker Image
        run: |
          docker push veedhi1995/service1:${{ github.sha }}
          docker push veedhi1995/service1:latest
